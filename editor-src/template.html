<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light dark">
<title>Editor</title>
<style>
:root{--bg:#ffffff;--bar:#eef1f4;--text:#14202b;--muted:#5d6b78;--line:#d6dce3;--accent:#1f5fbf;--tabon:#ffffff}
@media (prefers-color-scheme: dark){
  :root{--bg:#282c34;--bar:#18212a;--text:#e7edf3;--muted:#92a1af;--line:#2c3844;--accent:#6aa3f5;--tabon:#282c34}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#tabs{flex:none;display:flex;overflow-x:auto;background:var(--bar);border-bottom:1px solid var(--line);scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:2px;padding:0 4px 0 12px;height:40px;border-right:1px solid var(--line);
  color:var(--muted);cursor:pointer;white-space:nowrap;max-width:60vw}
.tab.active{background:var(--tabon);color:var(--text);box-shadow:inset 0 -3px 0 var(--accent);font-weight:600}
.tab .nm{overflow:hidden;text-overflow:ellipsis}
.tab .x{width:30px;height:30px;border:0;background:none;color:inherit;font-size:20px;line-height:1;border-radius:6px}
#editor{flex:1;min-height:0;overflow:hidden}
#editor .cm-editor{height:100%}
#editor .cm-editor.cm-focused{outline:none}
#symbols{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px;background:var(--bar);border-top:1px solid var(--line);scrollbar-width:none}
#symbols::-webkit-scrollbar{display:none}
.sym{flex:none;min-width:40px;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--text);font:600 16px ui-monospace,monospace}
.sym.wide{font-family:inherit;font-size:14px}
.sym:active{background:var(--accent);color:#fff}
</style>
</head>
<body>
<div id="app">
  <div id="tabs"></div>
  <div id="editor"></div>
  <div id="symbols"></div>
</div>
<script>
/*__BUNDLE__*/
</script>
</body>
</html>
